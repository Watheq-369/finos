name: eval

# Runs the whole suite on every push and pull request.
# runs/llm_cache.json is tracked, so the pipeline and the judge replay from cache:
# no API key, no network, no cost, and identical results every time. A cache miss
# means a prompt or a fixture changed, and it fails loudly rather than drifting.

on: [push, pull_request]

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: offline tests
        run: python -m pytest tests/ -q
      - name: eval suite and must-pass gates
        run: python -m finos.score
